<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphWar网页版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #e0e0e0; font-family: 'Consolas', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .ui { padding: 12px; background: #121218; border-bottom: 1px solid #252530; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        #func { flex: 1; padding: 10px; background: #1a1a25; color: #58a6ff; border: 1px solid #303040; border-radius: 6px; font-size: 16px; min-width: 260px; }
        #func:focus { outline: none; border-color: #58a6ff; }
        button { padding: 10px 22px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button#reset { background: #da3633; }
        #error { color: #f85149; padding: 5px 10px; min-height: 24px; width: 100%; font-size: 13px; }
        canvas { flex: 1; background: #0a0a0f; display: block; }
        .stats { display: flex; gap: 18px; font-size: 14px; padding-left: 10px; }
        .stats span { color: #58a6ff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="ui">
        <label style="color: #8b949e;">y =</label>
        <input id="func" value="sin(x)*35 + cos(x*0.4)*20" placeholder="输入函数，如：x^2*0.08">
        <button onclick="fire()">发射 (空格)</button>
        <button id="reset" onclick="resetGame()">重置 (R)</button>
        <div class="stats">
            <div>得分: <span id="score">0</span></div>
            <div>敌人: <span id="enemies">5</span></div>
            <div>障碍: <span id="obstacles">28</span></div>
            <div>命中率: <span id="accuracy">0%</span></div>
            <div>弹幕: <span id="projectiles">0</span></div>
        </div>
    </div>
    <div id="error"></div>
    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const errorDiv = document.getElementById('error');
const scoreEl = document.getElementById('score');
const enemiesEl = document.getElementById('enemies');
const accuracyEl = document.getElementById('accuracy');
const projectilesEl = document.getElementById('projectiles');

// ==================== 配置（速度↑ 步长↓ 连发支持） ====================
const EPSILON = 1e-6;
const CONFIG = {
    OBSTACLE_COUNT: 28,
    MIN_OBSTACLE_R: 30,
    MAX_OBSTACLE_R: 70,
    CRATER_RADIUS: 6,
    STEP: 0.18,          // 步长大幅细化，采样密度翻倍
    SPEED_SCALE: 9.0,    // 速度提升300%+，炮弹飞行更快
    ENEMY_R: 6,
    SPACING: 50
};

// ==================== AST解析器 ====================
const NodeType = { NUMBER: 'NUMBER', VARIABLE: 'VARIABLE', BINARY: 'BINARY', UNARY: 'UNARY', CONSTANT: 'CONSTANT' };
const PRECEDENCE = { '+': 1, '-': 1, '*': 2, '/': 2, '^': 3 };

function tokenize(str) {
    const tokens = []; let i = 0;
    while (i < str.length) {
        const ch = str[i];
        if (/\s/.test(ch)) { i++; continue; }
        if (/\d/.test(ch) || ch === '.') {
            let num = ''; while (i < str.length && /[\d.]/.test(str[i])) num += str[i++];
            tokens.push({ type: NodeType.NUMBER, value: parseFloat(num) }); continue;
        }
        if (ch === 'x') { tokens.push({ type: NodeType.VARIABLE, value: 'x' }); i++; continue; }
        if (ch === 'π' || (ch === 'p' && str[i+1] === 'pi')) {
            tokens.push({ type: NodeType.CONSTANT, value: Math.PI }); i += (ch === 'π') ? 1 : 2; continue;
        }
        if (/[a-z]/i.test(ch)) {
            let name = ''; while (i < str.length && /[a-z]/i.test(str[i])) name += str[i++];
            tokens.push({ type: NodeType.UNARY, value: name.toLowerCase() }); continue;
        }
        if ('+-*/^()'.includes(ch)) { tokens.push({ type: 'OPERATOR', value: ch }); i++; continue; }
        throw new Error(`非法字符: ${ch}`);
    }
    return tokens;
}

function parseExpression(tokens, minPrec = 0) {
    let left = parsePrimary(tokens);
    while (tokens.length && tokens[0].type === 'OPERATOR' && PRECEDENCE[tokens[0].value]) {
        const prec = PRECEDENCE[tokens[0].value];
        if (prec < minPrec) break;
        const op = tokens.shift().value;
        const nextMinPrec = (op === '^') ? prec : prec + 1;
        const right = parseExpression(tokens, nextMinPrec);
        left = { type: NodeType.BINARY, operator: op, left, right };
    }
    return left;
}

function parsePrimary(tokens) {
    const token = tokens.shift();
    if ([NodeType.NUMBER, NodeType.VARIABLE, NodeType.CONSTANT].includes(token.type)) return token;
    if (token.type === NodeType.UNARY) {
        if (tokens.shift().value !== '(') throw new Error(`函数 ${token.value} 缺左括号`);
        const arg = parseExpression(tokens);
        if (tokens.shift().value !== ')') throw new Error(`函数 ${token.value} 缺右括号`);
        return { ...token, argument: arg };
    }
    if (token.value === '(') {
        const expr = parseExpression(tokens);
        if (tokens.shift().value !== ')') throw new Error(`缺右括号`);
        return expr;
    }
    throw new Error(`意外符号: ${token.value}`);
}

function compile(ast) {
    const mathFuncs = { sin: Math.sin, cos: Math.cos, tan: Math.tan, sqrt: Math.sqrt, log: Math.log, abs: Math.abs };
    function evaluate(node, x) {
        switch (node.type) {
            case NodeType.NUMBER: return node.value;
            case NodeType.VARIABLE: return x;
            case NodeType.CONSTANT: return node.value;
            case NodeType.BINARY:
                const l = evaluate(node.left, x), r = evaluate(node.right, x);
                if (node.operator === '+') return l + r;
                if (node.operator === '-') return l - r;
                if (node.operator === '*') return l * r;
                if (node.operator === '/') return l / r;
                if (node.operator === '^') return Math.pow(l, r);
                break;
            case NodeType.UNARY: return mathFuncs[node.value](evaluate(node.argument, x));
        }
        throw new Error(`未知操作符: ${node.operator}`);
    }
    return function(x) { try { return evaluate(ast, x); } catch { return NaN; } };
}

function parseFunction(expr) {
    errorDiv.textContent = '';
    try {
        const tokens = tokenize(expr);
        const ast = parseExpression(tokens);
        if (tokens.length > 0) throw new Error(`多余字符: ${tokens[0].value}`);
        return compile(ast);
    } catch (e) { errorDiv.textContent = e.message; return null; }
}

// ==================== 碰撞核心（体积碰撞修正） ====================
function getLineCircleIntersections(p1, p2, circle) {
    const { x: cx, y: cy, r } = circle;
    const intersections = [];
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const fx = p1.x - cx;
    const fy = p1.y - cy;

    const a = dx*dx + dy*dy;
    const rSq = r*r;
    
    // 体积碰撞：两端点都在圆内时，返回起点作为交点
    const dist1Sq = fx*fx + fy*fy;
    const dist2Sq = (p2.x-cx)*(p2.x-cx) + (p2.y-cy)*(p2.y-cy);
    if (dist1Sq <= rSq + EPSILON && dist2Sq <= rSq + EPSILON) {
        return [{ x: p1.x, y: p1.y, t: 0 }];
    }

    if (a < EPSILON) return intersections;

    const b = 2 * (fx*dx + fy*dy);
    const c = fx*fx + fy*fy - rSq;
    const discriminant = b*b - 4*a*c;

    if (discriminant < -EPSILON) return intersections;

    const sqrtDisc = Math.sqrt(Math.max(discriminant, 0));
    const t1 = (-b - sqrtDisc) / (2*a);
    const t2 = (-b + sqrtDisc) / (2*a);

    if (t1 >= -EPSILON && t1 <= 1+EPSILON) {
        intersections.push({ x: p1.x + t1*dx, y: p1.y + t1*dy, t: Math.max(0, Math.min(1, t1)) });
    }
    if (Math.abs(discriminant) > EPSILON && t2 >= -EPSILON && t2 <= 1+EPSILON) {
        intersections.push({ x: p1.x + t2*dx, y: p1.y + t2*dy, t: Math.max(0, Math.min(1, t2)) });
    }

    return intersections.sort((a,b) => a.t - b.t);
}

function isPointInCrater(point) {
    for (const crater of craters) {
        const dx = point.x - crater.x;
        const dy = point.y - crater.y;
        if (dx*dx + dy*dy <= crater.radius*crater.radius + EPSILON) return true;
    }
    return false;
}

function checkSegmentCollision(p1, p2) {
    for (const obs of obstacles) {
        const intersections = getLineCircleIntersections(p1, p2, obs);
        if (intersections.length === 0) continue;
        const nearestHit = intersections[0];
        if (isPointInCrater(nearestHit)) continue;
        return { hit: true, point: nearestHit, obstacle: obs };
    }
    return { hit: false };
}

// ==================== 游戏逻辑（支持连发） ====================
let W, H, groundY;
let enemies = [];
let obstacles = [];
let craters = [];
let projectiles = []; // 存储所有活跃炮弹（支持连发）
let score = 0;
let totalShots = 0;
let hits = 0;

// 生成障碍物
function generateObstacles() {
    obstacles = [];
    for (let i = 0; i < CONFIG.OBSTACLE_COUNT; i++) {
        let attempts = 0;
        let valid = false;
        let obs;

        while (!valid && attempts < 2000) {
            attempts++;
            const r = CONFIG.MIN_OBSTACLE_R + Math.random() * (CONFIG.MAX_OBSTACLE_R - CONFIG.MIN_OBSTACLE_R);
            obs = {
                x: r + CONFIG.SPACING + Math.random() * (W - 2*(r + CONFIG.SPACING)),
                y: r + CONFIG.SPACING + Math.random() * (groundY - 2*(r + CONFIG.SPACING) - 40),
                r: r,
                color: `hsl(${Math.random()*360}, 45%, 22%)`
            };

            valid = true;
            for (const other of obstacles) {
                const dx = obs.x - other.x;
                const dy = obs.y - other.y;
                const minDist = obs.r + other.r + CONFIG.SPACING;
                if (dx*dx + dy*dy < minDist*minDist - EPSILON) { valid = false; break; }
            }

            if (valid) {
                const cannonDist = Math.hypot(obs.x - 50, obs.y - (groundY - 10));
                if (cannonDist < obs.r + 50 + CONFIG.SPACING) valid = false;
                if (Math.abs(obs.y + obs.r - groundY) < CONFIG.SPACING) valid = false;
            }
        }
        if (valid) obstacles.push(obs);
    }
    document.getElementById('obstacles').textContent = obstacles.length;
}

// 生成敌人
function spawnEnemies(count) {
    enemies = [];
    for (let i = 0; i < count; i++) {
        let attempts = 0;
        let valid = false;
        let enemy;

        while (!valid && attempts < 1000) {
            attempts++;
            enemy = {
                x: CONFIG.SPACING + Math.random() * (W - 2*CONFIG.SPACING),
                y: CONFIG.SPACING + Math.random() * (groundY - 2*CONFIG.SPACING),
                r: CONFIG.ENEMY_R
            };

            valid = true;
            for (const obs of obstacles) {
                const dx = enemy.x - obs.x;
                const dy = enemy.y - obs.y;
                if (dx*dx + dy*dy < (obs.r + enemy.r + 20)**2) { valid = false; break; }
            }
            if (valid && isPointInCrater(enemy)) valid = false;
        }
        if (valid) enemies.push(enemy);
    }
    enemiesEl.textContent = enemies.length;
}

function resize() {
    W = canvas.width = canvas.clientWidth;
    H = canvas.height = canvas.clientHeight;
    groundY = H * 0.82;
}

// 绘制基础场景
function draw() {
    ctx.clearRect(0, 0, W, H);

    // 网格
    ctx.strokeStyle = '#15151f';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 35) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 35) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // 地面
    ctx.strokeStyle = '#252530';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();

    // 障碍物+凹坑
    obstacles.forEach(obs => {
        ctx.fillStyle = obs.color;
        ctx.beginPath(); ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI*2); ctx.fill();
        craters.forEach(crater => {
            const dx = crater.x - obs.x;
            const dy = crater.y - obs.y;
            if (dx*dx + dy*dy < obs.r*obs.r + EPSILON) {
                ctx.fillStyle = '#0a0a0f';
                ctx.beginPath(); ctx.arc(crater.x, crater.y, crater.radius, 0, Math.PI*2); ctx.fill();
            }
        });
    });

    // 炮台
    ctx.fillStyle = '#58a6ff';
    ctx.beginPath(); ctx.arc(50, groundY - 10, 15, 0, Math.PI*2); ctx.fill();

    // 敌人
    enemies.forEach(e => {
        ctx.fillStyle = '#f85149';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
    });
}

// 绘制单枚炮弹轨迹
function drawTrajectory(points) {
    if (points.length < 2) return;
    ctx.strokeStyle = 'rgba(88, 166, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.stroke();
}

// 发射炮弹（无锁，支持连发）
function fire() {
    const fn = parseFunction(document.getElementById('func').value);
    if (!fn) return;

    totalShots++;
    accuracyEl.textContent = `${totalShots ? Math.round(hits/totalShots*100) : 0}%`;

    // 创建新炮弹实例
    projectiles.push({
        fn: fn,
        x: 50,
        prevPos: { x: 50, y: groundY - 10 },
        currentPos: { x: 50, y: groundY - 10 },
        points: [{ x: 50, y: groundY - 10 }],
        active: true
    });
}

// 更新单枚炮弹状态
function updateProjectile(proj) {
    if (!proj.active) return;

    // 高速移动+细步长采样
    proj.x += CONFIG.STEP * CONFIG.SPEED_SCALE;
    const mathX = (proj.x - 50) / CONFIG.SPEED_SCALE;
    const mathY = proj.fn(mathX);

    // 越界失效
    if (!isFinite(mathY) || proj.x > W || proj.prevPos.y > H || proj.prevPos.y < 0) {
        proj.active = false;
        return;
    }

    proj.currentPos = { x: proj.x, y: groundY - mathY * CONFIG.SPEED_SCALE };
    proj.points.push(proj.currentPos);

    // 障碍物碰撞检测
    const collision = checkSegmentCollision(proj.prevPos, proj.currentPos);
    if (collision.hit) {
        craters.push({
            x: collision.point.x,
            y: collision.point.y,
            radius: CONFIG.CRATER_RADIUS + Math.random() * 2
        });
        createImpactEffect(collision.point);
        proj.active = false;
        return;
    }

    // 敌人碰撞检测
    for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        const enemyCollision = getLineCircleIntersections(proj.prevPos, proj.currentPos, enemy);
        if (enemyCollision.length > 0) {
            enemies.splice(i, 1);
            hits++;
            score += 10;
            scoreEl.textContent = score;
            enemiesEl.textContent = enemies.length;
            accuracyEl.textContent = `${Math.round(hits/totalShots*100)}%`;

            if (enemies.length === 0) {
                setTimeout(() => spawnEnemies(5 + Math.floor(score/40)), 800);
            }
            proj.active = false;
            return;
        }
    }

    proj.prevPos = proj.currentPos;
}

// 碰撞粒子特效
function createImpactEffect(point) {
    const particles = [];
    for (let i = 0; i < 12; i++) {
        const angle = (i/12) * Math.PI*2;
        particles.push({
            x: point.x, y: point.y,
            vx: Math.cos(angle) * (2 + Math.random()),
            vy: Math.sin(angle) * (2 + Math.random()),
            life: 1,
            color: `hsl(${30 + Math.random()*30}, 100%, 60%)`
        });
    }

    function animateParticles() {
        if (particles.length === 0) return;
        draw(); // 叠加在主场景上
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.035;
            if (p.life <= 0) { particles.splice(i, 1); continue; }
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1;
        }
        if (particles.length > 0) requestAnimationFrame(animateParticles);
    }
    animateParticles();
}

// 全局游戏循环（驱动所有炮弹）
function gameLoop() {
    draw();

    // 更新并绘制所有活跃炮弹
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const proj = projectiles[i];
        updateProjectile(proj);
        if (proj.active) {
            drawTrajectory(proj.points);
            // 绘制炮弹
            ctx.fillStyle = '#ffa657';
            ctx.shadowColor = '#ffa657';
            ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(proj.currentPos.x, proj.currentPos.y, 4, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        } else {
            projectiles.splice(i, 1); // 移除失效炮弹
        }
    }

    projectilesEl.textContent = projectiles.length; // 显示当前弹幕数量
    requestAnimationFrame(gameLoop);
}

// 重置游戏
function resetGame() {
    score = 0;
    totalShots = 0;
    hits = 0;
    projectiles = []; // 清空所有炮弹
    craters = [];
    scoreEl.textContent = '0';
    accuracyEl.textContent = '0%';
    projectilesEl.textContent = '0';
    generateObstacles();
    spawnEnemies(5);
    draw();
}

// 初始化
window.onload = () => {
    resize();
    resetGame();
    gameLoop(); // 启动全局循环
};
window.onresize = () => {
    resize();
    draw();
};
document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); fire(); }
    if (e.code === 'KeyR') resetGame();
});

// 实时轨迹预览
funcInput.addEventListener('input', () => {
    const fn = parseFunction(funcInput.value);
    if (fn) {
        const previewPoints = [];
        let x = 50;
        for (let i = 0; i < 300; i++) {
            const mathX = (x - 50) / CONFIG.SPEED_SCALE;
            const mathY = fn(mathX);
            if (!isFinite(mathY) || x > W) break;
            previewPoints.push({ x, y: groundY - mathY * CONFIG.SPEED_SCALE });
            x += CONFIG.STEP * CONFIG.SPEED_SCALE;
        }
        draw();
        drawTrajectory(previewPoints);
    }
});
</script>
</body>
</html>
