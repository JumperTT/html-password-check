<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphwar网页版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #e0e0e0; font-family: 'Consolas', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .ui { padding: 12px; background: #121218; border-bottom: 1px solid #252530; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        #func { flex: 1; padding: 10px; background: #1a1a25; color: #58a6ff; border: 1px solid #303040; border-radius: 6px; font-size: 16px; min-width: 260px; }
        #func:focus { outline: none; border-color: #58a6ff; }
        button { padding: 10px 22px; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        button:hover { transform: translateY(-1px); }
        button#fire { background: #238636; }
        button#fire:hover { background: #2ea043; }
        button#reset { background: #da3633; }
        button#reset:hover { background: #f85149; }
        button#cheat { background: #9c27b0; }
        button#cheat:hover { background: #ba68c8; }
        #error { color: #f85149; padding: 5px 10px; min-height: 24px; width: 100%; font-size: 13px; }
        canvas { flex: 1; background: #0a0a0f; display: block; }
        .stats { display: flex; gap: 18px; font-size: 14px; padding-left: 10px; }
        .stats span { color: #58a6ff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="ui">
        <label style="color: #8b949e;">y =</label>
        <input id="func" value="sin(x)*10" placeholder="点击【！？挂？！】自动瞄准存活敌人">
        <button id="fire" onclick="fire()">发射 (空格)</button>
        <button id="reset" onclick="resetGame()">重置 (R)</button>
        <button id="cheat" onclick="activateCheat()">！？挂？！</button>
        <div class="stats">
            <div>得分: <span id="score">0</span></div>
            <div>敌人: <span id="enemies">5</span></div>
            <div>障碍: <span id="obstacles">28</span></div>
            <div>命中率: <span id="accuracy">0%</span></div>
            <div>弹幕: <span id="projectiles">0</span></div>
            <div>粒子: <span id="particles">0</span></div>
        </div>
    </div>
    <div id="error"></div>
    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const errorDiv = document.getElementById('error');
const funcInput = document.getElementById('func');
const scoreEl = document.getElementById('score');
const enemiesEl = document.getElementById('enemies');
const accuracyEl = document.getElementById('accuracy');
const projectilesEl = document.getElementById('projectiles');
const particlesEl = document.getElementById('particles');

const EPS = 1e-6;
const CONFIG = {
    OBSTACLE_COUNT: 28,
    MIN_OBSTACLE_R: 30,
    MAX_OBSTACLE_R: 70,
    CRATER_RADIUS: 6,
    STEP: 0.18,
    SPEED_SCALE: 9.0,
    ENEMY_R: 6,
    ENEMY_BORDER_WIDTH: 2,
    SPACING: 50,
    BLOOD_LIFETIME: 120,
    PARTICLE_COUNT: 25,
    FIXED_SUB_STEP: 5,
    PLAYER_R: 15,
    PLAYER_SAFE_DIST: 50
};

let W, H, groundY;
let playerX, playerY;
let enemies = [];
let obstacles = [];
let craters = [];
let bloodstains = [];
let particles = [];
let projectiles = [];
let score = 0;
let totalShots = 0;
let hits = 0;

// ==================== 纯数学折线瞄准（优先右侧，无则左侧，彩蛋提示）====================
function activateCheat() {
    // 彩蛋：敌人全灭了还点按钮
    if (enemies.length === 0) {
        errorDiv.textContent = "你还想怎样？！";
        errorDiv.style.color = "#f85149";
        setTimeout(() => { errorDiv.textContent = ""; }, 3000);
        return;
    }

    // 1. 分离左右侧存活敌人
    const rightTargets = [];
    const leftTargets = [];
    enemies.forEach(enemy => {
        const relX = (enemy.x - playerX) / CONFIG.SPEED_SCALE;
        const relY = (playerY - enemy.y) / CONFIG.SPEED_SCALE;
        if (relX > EPS) {
            rightTargets.push({ x: relX, y: relY });
        } else if (relX < -EPS) {
            leftTargets.push({ x: relX, y: relY });
        }
    });

    // 2. 优先选右侧，无右侧则选左侧，对应不同提示
    let targetPoints = [];
    let cheatMsg = "";
    if (rightTargets.length > 0) {
        targetPoints = rightTargets.sort((a, b) => a.x - b.x);
        cheatMsg = "开挂是不对的！！！！！（怒";
    } else if (leftTargets.length > 0) {
        targetPoints = leftTargets.sort((a, b) => a.x - b.x);
        cheatMsg = "你怎么还在开挂，啊？！";
    }

    // 加入炮台作为起点，过滤重复x坐标
    targetPoints.unshift({ x: 0, y: 0 });
    const uniquePoints = [targetPoints[0]];
    for (let i = 1; i < targetPoints.length; i++) {
        if (Math.abs(targetPoints[i].x - uniquePoints[uniquePoints.length - 1].x) > EPS) {
            uniquePoints.push(targetPoints[i]);
        }
    }

    if (uniquePoints.length < 2) {
        errorDiv.textContent = "敌人位置重叠，开挂失败！";
        errorDiv.style.color = "#f85149";
        setTimeout(() => { errorDiv.textContent = ""; }, 3000);
        return;
    }

    // 3. 计算斜率和跳变值，生成纯数学折线函数
    const slopes = [];
    for (let i = 0; i < uniquePoints.length - 1; i++) {
        const p1 = uniquePoints[i];
        const p2 = uniquePoints[i + 1];
        slopes.push((p2.y - p1.y) / (p2.x - p1.x));
    }

    let funcStr = `${slopes[0].toFixed(6)}*x`;
    for (let i = 1; i < slopes.length; i++) {
        const jump = slopes[i] - slopes[i - 1];
        const breakpoint = uniquePoints[i].x;
        funcStr += ` + ${jump.toFixed(6)}*max(0, x - ${breakpoint.toFixed(6)})`;
    }

    // 4. 更新输入框并显示对应提示
    funcInput.value = funcStr;
    funcInput.dispatchEvent(new Event('input'));

    errorDiv.textContent = cheatMsg;
    errorDiv.style.color = "#4caf50";
    setTimeout(() => { errorDiv.textContent = ""; errorDiv.style.color = "#f85149"; }, 3000);
}

// ==================== 函数解析（含除零保护）====================
function parseFunction(expr) {
    errorDiv.textContent = '';
    try {
        expr = expr.replace(/√/g, 'sqrt')
                   .replace(/π/g, 'pi')
                   .replace(/\^/g, '**')
                   .replace(/(\d)([a-zA-Z])/g, '$1*$2')
                   .replace(/(\))(\d)/g, '$1*$2')
                   .replace(/(\))([a-zA-Z])/g, '$1*$2');
        
        const node = math.compile(expr);
        return (x) => {
            try { 
                const result = node.evaluate({ x });
                if (!isFinite(result) || isNaN(result)) return 0;
                return result;
            } catch { 
                return 0;
            }
        };
    } catch (e) {
        errorDiv.textContent = `函数错误：${e.message}`;
        return null;
    }
}

// ==================== 碰撞检测核心 ====================
function getLineCircleIntersections(p1, p2, circle) {
    const { x: cx, y: cy, r } = circle;
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const fx = p1.x - cx;
    const fy = p1.y - cy;
    const a = dx*dx + dy*dy;
    const rSq = r*r;

    const dist1Sq = fx*fx + fy*fy;
    const dist2Sq = (p2.x-cx)*(p2.x-cx) + (p2.y-cy)*(p2.y-cy);
    if (dist1Sq <= rSq + EPS && dist2Sq <= rSq + EPS) {
        return [{ x: p1.x, y: p1.y, t: 0 }];
    }

    if (a < EPS) return [];
    const b = 2*(fx*dx + fy*dy);
    const c = fx*fx + fy*fy - rSq;
    const disc = b*b - 4*a*c;
    if (disc < -EPS) return [];

    const sqrtDisc = Math.sqrt(Math.max(disc, 0));
    const t1 = (-b - sqrtDisc)/(2*a);
    const t2 = (-b + sqrtDisc)/(2*a);
    const res = [];

    if (t1 >= -EPS && t1 <= 1+EPS) res.push({ x: p1.x + t1*dx, y: p1.y + t1*dy, t: Math.max(0, Math.min(1, t1)) });
    if (Math.abs(disc) > EPS && t2 >= -EPS && t2 <= 1+EPS) res.push({ x: p1.x + t2*dx, y: p1.y + t2*dy, t: Math.max(0, Math.min(1, t2)) });
    return res.sort((a,b) => a.t - b.t);
}

function isPointInCrater(pt) {
    for (const c of craters) {
        const dx = pt.x - c.x;
        const dy = pt.y - c.y;
        if (dx*dx + dy*dy <= c.radius*c.radius + EPS) return true;
    }
    return false;
}

function checkSegmentCollision(p1, p2) {
    for (const obs of obstacles) {
        const hits = getLineCircleIntersections(p1, p2, obs);
        if (hits.length === 0) continue;
        const hit = hits[0];
        if (!isPointInCrater(hit)) return { hit: true, point: hit, obstacle: obs };
    }
    return { hit: false };
}

// ==================== 初始化逻辑 ====================
function resize() {
    W = canvas.width = canvas.clientWidth;
    H = canvas.height = canvas.clientHeight;
    groundY = H * 0.82;
}

function spawnPlayer() {
    let attempts = 0;
    while (attempts++ < 1000) {
        playerX = CONFIG.PLAYER_R + 20 + Math.random()*(W - 2*(CONFIG.PLAYER_R + 20));
        playerY = CONFIG.PLAYER_R + 20 + Math.random()*(H - 2*(CONFIG.PLAYER_R + 20));
        
        let valid = true;
        for (const obs of obstacles) {
            const dx = playerX - obs.x;
            const dy = playerY - obs.y;
            if (dx*dx + dy*dy < (obs.r + CONFIG.PLAYER_R + 30)**2) valid = false;
        }
        for (const ene of enemies) {
            const dx = playerX - ene.x;
            const dy = playerY - ene.y;
            if (dx*dx + dy*dy < (ene.r + CONFIG.PLAYER_R + 20)**2) valid = false;
        }
        if (valid) return;
    }
    playerX = W/2; playerY = H/2;
}

function generateObstacles() {
    obstacles = [];
    for (let i = 0; i < CONFIG.OBSTACLE_COUNT; i++) {
        let attempts = 0;
        let valid = false;
        let obs;
        while (!valid && attempts++ < 2000) {
            const r = CONFIG.MIN_OBSTACLE_R + Math.random()*(CONFIG.MAX_OBSTACLE_R - CONFIG.MIN_OBSTACLE_R);
            obs = {
                x: r + CONFIG.SPACING + Math.random()*(W - 2*(r + CONFIG.SPACING)),
                y: r + CONFIG.SPACING + Math.random()*(groundY - 2*(r + CONFIG.SPACING) - 40),
                r,
                color: `hsl(${Math.random()*360}, 45%, 22%)`
            };
            valid = true;
            for (const other of obstacles) {
                const dx = obs.x - other.x;
                const dy = obs.y - other.y;
                if (dx*dx + dy*dy < (obs.r + other.r + CONFIG.SPACING)**2) valid = false;
            }
            if (playerX !== undefined) {
                const dx = obs.x - playerX;
                const dy = obs.y - playerY;
                if (dx*dx + dy*dy < (obs.r + CONFIG.PLAYER_R + CONFIG.PLAYER_SAFE_DIST)**2) valid = false;
            }
            if (Math.abs(obs.y + obs.r - groundY) < CONFIG.SPACING) valid = false;
        }
        if (valid) obstacles.push(obs);
    }
    document.getElementById('obstacles').textContent = obstacles.length;
}

function spawnEnemies(count) {
    enemies = [];
    for (let i = 0; i < count; i++) {
        let attempts = 0;
        let valid = false;
        let enemy;
        while (!valid && attempts++ < 1000) {
            enemy = {
                x: CONFIG.SPACING + Math.random()*(W - 2*CONFIG.SPACING),
                y: CONFIG.SPACING + Math.random()*(groundY - 2*CONFIG.SPACING),
                r: CONFIG.ENEMY_R
            };
            valid = true;
            for (const obs of obstacles) {
                const dx = enemy.x - obs.x;
                const dy = enemy.y - obs.y;
                if (dx*dx + dy*dy < (obs.r + enemy.r + 20)**2) valid = false;
            }
            if (playerX !== undefined) {
                const dx = enemy.x - playerX;
                const dy = enemy.y - playerY;
                if (dx*dx + dy*dy < (enemy.r + CONFIG.PLAYER_R + 30)**2) valid = false;
            }
            if (isPointInCrater(enemy)) valid = false;
        }
        if (valid) enemies.push(enemy);
    }
    enemiesEl.textContent = enemies.length;
}

// ==================== 绘制逻辑 ====================
function draw() {
    ctx.clearRect(0, 0, W, H);
    
    ctx.strokeStyle = '#15151f';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 35) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 35) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    
    ctx.strokeStyle = '#252530';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();

    obstacles.forEach(obs => {
        ctx.fillStyle = obs.color;
        ctx.beginPath(); ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI*2); ctx.fill();
        craters.forEach(crater => {
            const dx = crater.x - obs.x;
            const dy = crater.y - obs.y;
            if (dx*dx + dy*dy < obs.r*obs.r + EPS) {
                ctx.fillStyle = '#0a0a0f';
                ctx.beginPath(); ctx.arc(crater.x, crater.y, crater.radius, 0, Math.PI*2); ctx.fill();
            }
        });
    });

    if (playerX !== undefined) {
        ctx.fillStyle = '#58a6ff';
        ctx.beginPath(); ctx.arc(playerX, playerY, CONFIG.PLAYER_R, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#8cdcff';
        ctx.beginPath(); ctx.arc(playerX, playerY, CONFIG.PLAYER_R*0.5, 0, Math.PI*2); ctx.fill();
    }

    enemies.forEach(e => {
        ctx.fillStyle = '#f85149';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#8b0000';
        ctx.lineWidth = CONFIG.ENEMY_BORDER_WIDTH;
        ctx.stroke();
    });

    for (let i = bloodstains.length-1; i>=0; i--) {
        const bs = bloodstains[i];
        bs.life--;
        if (bs.life <= 0) { bloodstains.splice(i,1); continue; }
        const alpha = bs.life / CONFIG.BLOOD_LIFETIME;
        ctx.fillStyle = `rgba(180,0,0,${alpha*0.7})`;
        ctx.beginPath(); ctx.arc(bs.x, bs.y, bs.radius, 0, Math.PI*2); ctx.fill();
    }
}

// ==================== 粒子系统 ====================
function createImpactEffect(pt, isEnemy=false) {
    const cnt = CONFIG.PARTICLE_COUNT;
    const baseHue = isEnemy ? 0 : 30;
    for (let i=0; i<cnt; i++) {
        const angle = (i/cnt)*Math.PI*2 + Math.random()*0.5;
        const speed = isEnemy ? 2+Math.random()*3 : 1.5+Math.random()*2.5;
        particles.push({
            x: pt.x + (Math.random()-0.5)*4,
            y: pt.y + (Math.random()-0.5)*4,
            vx: Math.cos(angle)*speed,
            vy: Math.sin(angle)*speed,
            life: 1,
            decay: 0.02+Math.random()*0.02,
            color: `hsl(${baseHue+Math.random()*30},100%,${60+Math.random()*30}%)`,
            size: isEnemy ? 2+Math.random()*2 : 1.5+Math.random()*2,
            gravity: isEnemy ? 0.05 : 0,
            type: isEnemy ? 'blood' : 'spark'
        });
    }
    for (let i=0; i<5; i++) {
        particles.push({
            x: pt.x, y: pt.y,
            vx: (Math.random()-0.5)*4,
            vy: (Math.random()-0.5)*4,
            life: 1,
            decay: 0.03,
            color: isEnemy ? '#8b0000' : '#ff8800',
            size: 1+Math.random()*2,
            gravity: 0.1,
            type: 'debris'
        });
    }
}

function updateAndDrawParticles() {
    for (let i=particles.length-1; i>=0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if (p.gravity) p.vy += p.gravity;
        p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i,1); continue; }
        
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2); ctx.fill();
        
        if (p.type === 'debris' && p.life > 0.5) {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(p.x-p.vx*2, p.y-p.vy*2); ctx.lineTo(p.x, p.y); ctx.stroke();
        }
    }
    ctx.globalAlpha = 1;
    particlesEl.textContent = particles.length;
}

// ==================== 炮弹更新（核心修改：穿透敌人）====================
function updateProjectile(proj) {
    if (!proj.active) return;

    proj.x += proj.dir * CONFIG.STEP * CONFIG.SPEED_SCALE;
    const mathX = (proj.x - playerX) / CONFIG.SPEED_SCALE;
    const mathY = proj.fn(mathX);

    if (!isFinite(mathY) || isNaN(mathY)) {
        const safeY = 0;
        const realY = playerY - safeY * CONFIG.SPEED_SCALE;
        const renderY = Math.max(0, Math.min(H, realY));
        proj.points.push({ x: proj.x, y: renderY });
        proj.currentPos = { x: proj.x, y: renderY };
        proj.prevPos = proj.currentPos;
        proj.prevRealY = realY;
        return;
    }

    if (proj.x < -50 || proj.x > W+50) {
        proj.active = false;
        return;
    }

    const realY = playerY - mathY * CONFIG.SPEED_SCALE;
    const renderY = Math.max(0, Math.min(H, realY));
    proj.points.push({ x: proj.x, y: renderY });

    const dx = proj.x - proj.prevPos.x;
    const realDy = realY - proj.prevRealY;
    const dist = Math.sqrt(dx*dx + realDy*realDy);

    if (dist > EPS) {
        const unitX = dx/dist;
        const unitY = realDy/dist;
        let walked = 0;

        while (walked < dist - EPS) {
            const step = Math.min(CONFIG.FIXED_SUB_STEP, dist - walked);
            walked += step;
            const subX = proj.prevPos.x + unitX*walked;
            const subRealY = proj.prevRealY + unitY*walked;
            const subRenderY = Math.max(0, Math.min(H, subRealY));

            const startIn = proj.prevRealY >= 0 && proj.prevRealY <= H;
            const endIn = subRealY >= 0 && subRealY <= H;

            if (startIn && endIn) {
                const segStart = { x: proj.prevPos.x, y: proj.prevRealY };
                const segEnd = { x: subX, y: subRealY };

                // 障碍物碰撞（仍然阻挡）
                const col = checkSegmentCollision(segStart, segEnd);
                if (col.hit) {
                    craters.push({ x: col.point.x, y: col.point.y, radius: CONFIG.CRATER_RADIUS + Math.random()*2 });
                    createImpactEffect(col.point, false);
                    proj.active = false;
                    proj.currentPos = { x: subX, y: subRenderY };
                    return;
                }

                // 敌人碰撞（修改为穿透：造成伤害和特效，但不销毁炮弹）
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const ene = enemies[j];
                    const eneCol = getLineCircleIntersections(segStart, segEnd, ene);
                    if (eneCol.length > 0) {
                        // 加分、统计、移除敌人
                        bloodstains.push({ x: ene.x, y: ene.y, radius: ene.r * 1.5, life: CONFIG.BLOOD_LIFETIME });
                        enemies.splice(j, 1);
                        hits++; score += 10;
                        scoreEl.textContent = score;
                        enemiesEl.textContent = enemies.length;
                        accuracyEl.textContent = `${Math.round(hits/totalShots*100)}%`;
                        if (enemies.length === 0) spawnEnemies(5 + Math.floor(score/40));
                        
                        // 创建击杀特效
                        createImpactEffect(ene, true);
                        
                        // 关键修改：不设置 proj.active = false，让炮弹继续飞行
                        // 跳出当前敌人循环，继续检测其他敌人（虽然一个细分步长内通常只有一个）
                        // 不需要 return，继续执行细分循环
                    }
                }
            }

            proj.prevPos = { x: subX, y: subRenderY };
            proj.prevRealY = subRealY;
        }
    }

    proj.currentPos = { x: proj.x, y: renderY };
    proj.prevPos = proj.currentPos;
    proj.prevRealY = realY;
}

// ==================== 游戏循环 ====================
function gameLoop() {
    draw();
    
    for (let i=projectiles.length-1; i>=0; i--) {
        const proj = projectiles[i];
        updateProjectile(proj);
        if (proj.active) {
            ctx.strokeStyle = proj.dir === 1 ? 'rgba(88,166,255,0.6)' : 'rgba(88,166,255,0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(proj.points[0].x, proj.points[0].y);
            for (let j=1; j<proj.points.length; j++) ctx.lineTo(proj.points[j].x, proj.points[j].y);
            ctx.stroke();
            
            ctx.fillStyle = '#ffaa33';
            ctx.shadowColor = '#ffaa33';
            ctx.shadowBlur = 20;
            ctx.beginPath(); ctx.arc(proj.currentPos.x, proj.currentPos.y, 6, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        } else {
            projectiles.splice(i,1);
        }
    }
    
    updateAndDrawParticles();
    projectilesEl.textContent = projectiles.length;
    requestAnimationFrame(gameLoop);
}

// ==================== 交互逻辑 ====================
function fire() {
    const fn = parseFunction(document.getElementById('func').value);
    if (!fn || playerX === undefined) return;
    
    totalShots++;
    accuracyEl.textContent = `${totalShots ? Math.round(hits/totalShots*100) : 0}%`;

    const initMathY = fn(0);
    const initRealY = playerY - initMathY * CONFIG.SPEED_SCALE;
    const initRenderY = Math.max(0, Math.min(H, initRealY));

    projectiles.push({
        fn, x: playerX, dir: 1,
        prevPos: { x: playerX, y: initRenderY }, prevRealY: initRealY,
        currentPos: { x: playerX, y: initRenderY },
        points: [{ x: playerX, y: initRenderY }], active: true
    });
    projectiles.push({
        fn, x: playerX, dir: -1,
        prevPos: { x: playerX, y: initRenderY }, prevRealY: initRealY,
        currentPos: { x: playerX, y: initRenderY },
        points: [{ x: playerX, y: initRenderY }], active: true
    });
}

function resetGame() {
    score = 0; totalShots = 0; hits = 0;
    projectiles = []; craters = []; bloodstains = []; particles = [];
    obstacles = []; enemies = [];
    
    generateObstacles();
    spawnPlayer();
    spawnEnemies(5);
    
    scoreEl.textContent = '0';
    accuracyEl.textContent = '0%';
    projectilesEl.textContent = '0';
    particlesEl.textContent = '0';
    draw();
}

// ==================== 初始化 ====================
window.onload = () => {
    resize();
    resetGame();
    gameLoop();
};
window.onresize = () => {
    resize();
    draw();
};
document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); fire(); }
    if (e.code === 'KeyR') resetGame();
});

// 实时轨迹预览
funcInput.addEventListener('input', () => {
    const fn = parseFunction(funcInput.value);
    if (!fn || playerX === undefined) return;
    
    draw();
    const ptsR = [], ptsL = [];
    
    let xR = playerX;
    for (let i=0; i<400; i++) {
        const mX = (xR - playerX)/CONFIG.SPEED_SCALE;
        const mY = fn(mX);
        if (!isFinite(mY) || xR > W+50) break;
        const rY = playerY - mY*CONFIG.SPEED_SCALE;
        const renY = Math.max(0, Math.min(H, rY));
        ptsR.push({ x: xR, y: renY });
        xR += CONFIG.STEP * CONFIG.SPEED_SCALE;
    }
    
    let xL = playerX;
    for (let i=0; i<400; i++) {
        const mX = (xL - playerX)/CONFIG.SPEED_SCALE;
        const mY = fn(mX);
        if (!isFinite(mY) || xL < -50) break;
        const rY = playerY - mY*CONFIG.SPEED_SCALE;
        const renY = Math.max(0, Math.min(H, rY));
        ptsL.push({ x: xL, y: renY });
        xL -= CONFIG.STEP * CONFIG.SPEED_SCALE;
    }
    
    ctx.strokeStyle = 'rgba(88,166,255,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (ptsR.length) {
        ctx.moveTo(ptsR[0].x, ptsR[0].y);
        for (let i=1; i<ptsR.length; i++) ctx.lineTo(ptsR[i].x, ptsR[i].y);
    }
    ctx.stroke();
    
    ctx.strokeStyle = 'rgba(88,166,255,0.3)';
    ctx.beginPath();
    if (ptsL.length) {
        ctx.moveTo(ptsL[0].x, ptsL[0].y);
        for (let i=1; i<ptsL.length; i++) ctx.lineTo(ptsL[i].x, ptsL[i].y);
    }
    ctx.stroke();
});
</script>
