<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>叶毕希是给 · 流光</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        #stage {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #000;
            cursor: crosshair;
        }
        .glyph {
            position: absolute;
            left: 0;
            top: 0;
            white-space: nowrap;
            font-weight: 900;
            font-family: "Impact", "Arial Black", "PingFang SC", "Microsoft YaHei", sans-serif;
            will-change: transform;
            transform: translate3d(-9999px, -9999px, 0);
            backface-visibility: hidden;
            pointer-events: none;
        }
        .glyph.big {
            text-shadow: 0 0 8px currentColor, 0 0 22px currentColor;
        }
        .glyph.small {
            text-shadow: none;
        }
        .glyph.drifter {
            text-shadow: none !important;
            opacity: 0.85;
        }
        #veil {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #555;
            font: 14px system-ui, sans-serif;
            z-index: 99;          /* 提高层级，确保在最上面 */
            transition: opacity .4s;
            cursor: pointer;      /* 提示可点击 */
        }
    </style>
</head>
<body>
    <div id="stage"></div>
    <div id="veil">press any key to continue</div>

    <script>
        /* ===================== 配置区 ===================== */
        var WORD = "叶毕希是给";
        var SAY = "叶毕希是给";
        var COUNT = 83;
        var MIN_SIZE = 32;
        var MAX_SIZE = 130;
        var GLOW_SIZE = 72;
        var SAY_GAP = 380;
        var SAY_PITCH = 1.9;
        var SAY_RATE = 1.5;
        var SAY_VOLUME = 1;
        var DRIFTER_COUNT = 15;
        /* ================================================== */

        var stage = document.getElementById('stage');
        var veil = document.getElementById('veil');
        var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

        function resize() { W = window.innerWidth; H = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);

        var COLORS = ['#ff2d2d', '#ff8a00', '#ffe600', '#39ff14', '#00e5ff',
            '#2979ff', '#b026ff', '#ff2fd0', '#ffffff'
        ];

        function rnd(a, b) { return a + Math.random() * (b - a); }
        function pickColor() { return COLORS[(Math.random() * COLORS.length) | 0]; }

        /* ================ Glyph 类 ================ */
        function Glyph(cx, cy) {
            var el = document.createElement('div');
            el.className = 'glyph';
            el.textContent = WORD;
            stage.appendChild(el);
            this.el = el;
            if (cx !== undefined && cy !== undefined) {
                this.reset(false, cx, cy);
            } else {
                this.reset(true);
            }
        }

        Glyph.prototype.reset = function(init, fx, fy) {
            this.size = rnd(MIN_SIZE, MAX_SIZE);
            if (fx !== undefined && fy !== undefined) {
                this.x = fx;
                this.y = fy;
            } else if (init) {
                this.x = rnd(-80, W + 80);
                this.y = rnd(-80, H + 80);
            } else {
                this.x = Math.random() < .5 ? -90 : W + 90;
                this.y = rnd(-80, H + 80);
            }
            this.vx = rnd(-7, 7) || 1;
            this.vy = rnd(-7, 7) || 1;
            this.rot = rnd(0, 360);
            this.vr = rnd(-4, 4);
            this.spin = rnd(0.6, 1.7);
            this.phase = rnd(0, Math.PI * 2);
            this.pulse = rnd(1.5, 4);
            this.scale = 1;
            this.vs = rnd(0.010, 0.020) * (Math.random() < .5 ? -1 : 1);
            this.color = pickColor();
            this.hue = Math.random() < .28;
            this.hs = rnd(1, 5);
            this.el.className = 'glyph ' + (this.size >= GLOW_SIZE ? 'big' : 'small');
            this.el.style.fontSize = this.size + 'px';
            this.el.style.color = this.color;
            this.el.style.transform =
                'translate3d(' + (this.x | 0) + 'px,' + (this.y | 0) + 'px,0)' +
                ' rotate(' + this.rot.toFixed(1) + 'deg)' +
                ' scale(' + this.scale.toFixed(3) + ')';
        };

        Glyph.prototype.tick = function(t, dt) {
            var f = 1 + 0.48 * Math.sin(t * 0.0016 * this.spin + this.phase);
            this.phase += 0.012 * this.pulse * dt;
            this.x += this.vx * f * dt;
            this.y += this.vy * f * dt;
            this.rot += this.vr * dt;
            this.scale += this.vs * dt;
            if (this.scale > 1.18 || this.scale < 0.76) this.vs *= -1;
            if (this.x < -130 || this.x > W + 130) this.vx *= -1;
            if (this.y < -130 || this.y > H + 130) this.vy *= -1;
            if (Math.random() < 0.0035) this.vx *= -1;
            if (Math.random() < 0.0035) this.vy *= -1;
            if (this.hue && Math.random() < 0.006 * this.hs) {
                this.color = pickColor();
                this.el.style.color = this.color;
            }
            this.el.style.transform =
                'translate3d(' + (this.x | 0) + 'px,' + (this.y | 0) + 'px,0)' +
                ' rotate(' + this.rot.toFixed(1) + 'deg)' +
                ' scale(' + this.scale.toFixed(3) + ')';
        };

        /* ================ Drifter 类 ================ */
        function Drifter() {
            var el = document.createElement('div');
            el.className = 'glyph drifter';
            el.textContent = WORD;
            stage.appendChild(el);
            this.el = el;
            this.size = rnd(28, 88);
            this.x = rnd(-300, -60);
            this.y = rnd(40, H - 40);
            this.speed = rnd(1.6, 4.2);
            this.color = pickColor();
            this.hueShift = Math.random() < 0.45;
            this.hueTimer = 0;
            this.floatPhase = rnd(0, Math.PI * 2);
            this.floatAmp = rnd(4, 13);
            this.floatSpeed = rnd(0.015, 0.045);
            this.el.style.fontSize = this.size + 'px';
            this.el.style.color = this.color;
            this.el.style.transform = 'translate3d(' + (this.x | 0) + 'px,' + (this.y | 0) + 'px,0)';
        }

        Drifter.prototype.tick = function(t, dt) {
            this.x += this.speed * dt;
            this.floatPhase += this.floatSpeed * dt;
            var yOff = Math.sin(this.floatPhase) * this.floatAmp;
            if (this.hueShift && Math.random() < 0.008) {
                this.color = pickColor();
                this.el.style.color = this.color;
            }
            this.el.style.transform =
                'translate3d(' + (this.x | 0) + 'px,' + ((this.y + yOff) | 0) + 'px,0)';
            if (this.x > W + 280) {
                this.x = rnd(-320, -80);
                this.y = rnd(40, H - 40);
                this.speed = rnd(1.6, 4.2);
                this.floatPhase = rnd(0, Math.PI * 2);
                if (this.hueShift) {
                    this.color = pickColor();
                    this.el.style.color = this.color;
                } else {
                    if (Math.random() < 0.25) {
                        this.color = pickColor();
                        this.el.style.color = this.color;
                    }
                }
            }
        };

        /* ================ 初始化对象 ================ */
        var items = [];
        for (var i = 0; i < COUNT; i++) items.push(new Glyph());
        for (var i = 0; i < DRIFTER_COUNT; i++) items.push(new Drifter());

        /* ================ 动画循环 ================ */
        var last = performance.now(), tAcc = 0;
        function frame(now) {
            var dt = Math.min((now - last) / 16.67, 3);
            last = now;
            tAcc += dt;
            for (var i = 0; i < items.length; i++) items[i].tick(tAcc, dt);
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        /* ================ TTS ================ */
        var voice = null, ttsOK = 'speechSynthesis' in window;
        function pickVoice() {
            if (!ttsOK) return;
            var vs = speechSynthesis.getVoices() || [];
            var zh = vs.filter(function(v) { return /zh|cmn|Chinese/i.test(v.lang + v.name); });
            voice = zh.filter(function(v) { return v.localService; })[0] ||
                zh[0] ||
                vs.filter(function(v) { return v.localService; })[0] ||
                vs[0] || null;
        }
        if (ttsOK) {
            pickVoice();
            speechSynthesis.onvoiceschanged = pickVoice;
        }

        var lastSay = 0, saying = false;
        function say(now) {
            if (!ttsOK) { requestAnimationFrame(say); return; }
            if (now - lastSay >= SAY_GAP && !saying) {
                lastSay = now;
                saying = true;
                try {
                    speechSynthesis.cancel();
                    setTimeout(function() {
                        var u = new SpeechSynthesisUtterance(SAY);
                        if (voice) { u.voice = voice; u.lang = voice.lang; }
                        else { u.lang = 'zh-CN'; }
                        u.pitch = SAY_PITCH;
                        u.rate = SAY_RATE;
                        u.volume = SAY_VOLUME;
                        u.onend = function() { saying = false; };
                        u.onerror = function() { saying = false; };
                        speechSynthesis.speak(u);
                    }, 80);
                } catch (e) { saying = false; }
            }
            requestAnimationFrame(say);
        }
        requestAnimationFrame(say);

        document.addEventListener('visibilitychange', function() {
            if (!ttsOK) return;
            if (document.hidden) speechSynthesis.cancel();
        });

        /* ================ 点击添加新文字 ================ */
        stage.addEventListener('click', function(e) {
            var rect = stage.getBoundingClientRect();
            var cx = e.clientX - rect.left;
            var cy = e.clientY - rect.top;
            var fresh = new Glyph(cx, cy);
            items.push(fresh);
        });
        stage.addEventListener('touchstart', function(e) {
            var touch = e.changedTouches[0];
            var rect = stage.getBoundingClientRect();
            var cx = touch.clientX - rect.left;
            var cy = touch.clientY - rect.top;
            var fresh = new Glyph(cx, cy);
            items.push(fresh);
        }, { passive: true });

        /* ================ ★★★ 关键修复：解除遮罩 ★★★ ================ */
        function dismissVeil() {
            if (veil.style.display === 'none') return; // 防止重复执行
            veil.style.opacity = '0';
            veil.style.pointerEvents = 'none';
            setTimeout(function() {
                veil.style.display = 'none';
            }, 400);
        }

        // 方式一：按下任意键盘键
        document.addEventListener('keydown', dismissVeil);
        // 方式二：点击遮罩本身
        veil.addEventListener('click', dismissVeil);
        // 方式三：触摸遮罩（移动端）
        veil.addEventListener('touchstart', dismissVeil, { passive: true });
    </script>
</body>
</html>
