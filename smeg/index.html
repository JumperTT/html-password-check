<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>叶毕希是给</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        #stage {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #000;
            cursor: crosshair;
        }
        .glyph {
            position: absolute;
            left: 0;
            top: 0;
            white-space: nowrap;
            font-weight: 900;
            font-family: "Impact", "Arial Black", "PingFang SC", "Microsoft YaHei", sans-serif;
            will-change: transform;
            transform: translate3d(-9999px, -9999px, 0);
            backface-visibility: hidden;
            pointer-events: none;
            /* 背景文字无描边，弹幕单独设置 */
            -webkit-text-stroke: none;
            text-shadow: none !important;
        }
        .glyph.big, .glyph.small { text-shadow: none !important; }
        .glyph.drifter {
            text-shadow: none !important;
            opacity: 0.85;
            /* 弹幕保留灰色描边 */
            -webkit-text-stroke: 1px #888;
        }
        #veil {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #555;
            font: 14px system-ui, sans-serif;
            z-index: 99;
            transition: opacity .4s;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="stage"></div>
    <div id="veil">press any key to continue</div>

    <script>
        /* ===================== 配置区 ===================== */
        var WORD = "叶毕希是给";
        var SAY = "叶毕希是给";
        var COUNT = 120;          /* 背景文字数量（增多） */
        var MIN_SIZE = 36;
        var MAX_SIZE = 110;
        var SAY_GAP = 500;
        var SAY_PITCH = 1.9;
        var SAY_RATE = 1.5;
        var SAY_VOLUME = 1;
        var DRIFTER_COUNT = 12;   /* 弹幕数量 */
        var DRIFTER_SPEED = -3;   /* 弹幕向左速度 */
        var DRIFTER_SIZE = 34;    /* 弹幕字体大小 */
        var DRIFTER_SPACING = 180;/* 弹幕水平间距 */
        /* ================================================== */

        var stage = document.getElementById('stage');
        var veil = document.getElementById('veil');
        var W = 0, H = 0;

        function resize() { W = window.innerWidth; H = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);

        function rnd(a, b) { return a + Math.random() * (b - a); }

        /* ================ Glyph 背景文字（颜色渐变） ================ */
        function Glyph(cx, cy) {
            var el = document.createElement('div');
            el.className = 'glyph';
            el.textContent = WORD;
            stage.appendChild(el);
            this.el = el;
            // 每个文字独立的色相、饱和度、亮度、变化速度
            this.hue = rnd(0, 360);
            this.hueSpeed = rnd(0.08, 0.25) * (Math.random() < 0.5 ? 1 : -1);
            this.sat = rnd(65, 95);
            this.light = rnd(50, 75);
            if (cx !== undefined && cy !== undefined) {
                this.reset(false, cx, cy);
            } else {
                this.reset(true);
            }
        }

        Glyph.prototype.reset = function(init, fx, fy) {
            this.size = rnd(MIN_SIZE, MAX_SIZE);
            if (fx !== undefined && fy !== undefined) {
                this.x = fx;
                this.y = fy;
            } else if (init) {
                this.x = rnd(-80, W + 80);
                this.y = rnd(-80, H + 80);
            } else {
                this.x = Math.random() < .5 ? -90 : W + 90;
                this.y = rnd(-80, H + 80);
            }
            this.vx = rnd(-5, 5) || 1;
            this.vy = rnd(-5, 5) || 1;
            this.rot = rnd(0, 360);
            this.vr = rnd(-3, 3);
            this.spin = rnd(0.6, 1.7);
            this.phase = rnd(0, Math.PI * 2);
            this.pulse = rnd(1.5, 4);
            this.scale = 1;
            this.vs = rnd(0.010, 0.016) * (Math.random() < .5 ? -1 : 1);
            this.el.className = 'glyph';
            this.el.style.fontSize = this.size + 'px';
            // 立即应用颜色
            this.el.style.color = 'hsl(' + this.hue + ',' + this.sat + '%,' + this.light + '%)';
            this.el.style.transform =
                'translate3d(' + (this.x | 0) + 'px,' + (this.y | 0) + 'px,0)' +
                ' rotate(' + this.rot.toFixed(1) + 'deg)' +
                ' scale(' + this.scale.toFixed(3) + ')';
        };

        Glyph.prototype.tick = function(t, dt) {
            // 颜色渐变：色相随时间变化
            this.hue += this.hueSpeed * dt;
            if (this.hue > 360) this.hue -= 360;
            if (this.hue < 0) this.hue += 360;
            this.el.style.color = 'hsl(' + this.hue + ',' + this.sat + '%,' + this.light + '%)';

            var f = 1 + 0.38 * Math.sin(t * 0.0012 * this.spin + this.phase);
            this.phase += 0.01 * this.pulse * dt;
            this.x += this.vx * f * dt;
            this.y += this.vy * f * dt;
            this.rot += this.vr * dt;
            this.scale += this.vs * dt;
            if (this.scale > 1.15 || this.scale < 0.78) this.vs *= -1;
            if (this.x < -130 || this.x > W + 130) this.vx *= -1;
            if (this.y < -130 || this.y > H + 130) this.vy *= -1;
            if (Math.random() < 0.004) this.vx *= -1;
            if (Math.random() < 0.004) this.vy *= -1;

            this.el.style.transform =
                'translate3d(' + (this.x | 0) + 'px,' + (this.y | 0) + 'px,0)' +
                ' rotate(' + this.rot.toFixed(1) + 'deg)' +
                ' scale(' + this.scale.toFixed(3) + ')';
        };

        /* ================ Drifter 弹幕（颜色固定，从右向左） ================ */
        function Drifter(index) {
            var el = document.createElement('div');
            el.className = 'glyph drifter';
            el.textContent = WORD;
            stage.appendChild(el);
            this.el = el;
            this.index = index;
            this.size = DRIFTER_SIZE;
            this.x = W + 60 + index * DRIFTER_SPACING;
            this.y = rnd(60, H - 60);
            this.speed = DRIFTER_SPEED;
            // 颜色固定，初始随机后不再变化
            this.color = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
            this.floatPhase = rnd(0, Math.PI * 2);
            this.floatAmp = rnd(3, 10);
            this.floatSpeed = rnd(0.025, 0.05);
            this.el.style.fontSize = this.size + 'px';
            this.el.style.color = this.color;
            this.el.style.transform = 'translate3d(' + (this.x | 0) + 'px,' + (this.y | 0) + 'px,0)';
        }

        Drifter.prototype.tick = function(t, dt) {
            this.x += this.speed * dt;
            this.floatPhase += this.floatSpeed * dt;
            var yOff = Math.sin(this.floatPhase) * this.floatAmp;
            this.el.style.transform =
                'translate3d(' + (this.x | 0) + 'px,' + ((this.y + yOff) | 0) + 'px,0)';
            if (this.x < -350) {
                this.x = W + 60 + this.index * DRIFTER_SPACING;
                this.y = rnd(60, H - 60);
                this.floatPhase = rnd(0, Math.PI * 2);
                // 颜色不变
            }
        };

        /* ================ 初始化 ================ */
        var items = [];
        for (var i = 0; i < COUNT; i++) items.push(new Glyph());
        for (var i = 0; i < DRIFTER_COUNT; i++) items.push(new Drifter(i));

        /* ================ 动画循环 ================ */
        var last = performance.now(), tAcc = 0;
        function frame(now) {
            var dt = Math.min((now - last) / 16.67, 3);
            last = now;
            tAcc += dt;
            for (var i = 0; i < items.length; i++) items[i].tick(tAcc, dt);
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        /* ================ TTS ================ */
        var voice = null, ttsOK = 'speechSynthesis' in window;
        function pickVoice() {
            if (!ttsOK) return;
            var vs = speechSynthesis.getVoices() || [];
            var zh = vs.filter(function(v) { return /zh|cmn|Chinese/i.test(v.lang + v.name); });
            voice = zh.filter(function(v) { return v.localService; })[0] ||
                zh[0] ||
                vs.filter(function(v) { return v.localService; })[0] ||
                vs[0] || null;
        }
        if (ttsOK) {
            pickVoice();
            speechSynthesis.onvoiceschanged = pickVoice;
        }

        var lastSay = 0, saying = false;
        function say(now) {
            if (!ttsOK) { requestAnimationFrame(say); return; }
            if (now - lastSay >= SAY_GAP && !saying) {
                lastSay = now;
                saying = true;
                try {
                    speechSynthesis.cancel();
                    setTimeout(function() {
                        var u = new SpeechSynthesisUtterance(SAY);
                        if (voice) { u.voice = voice; u.lang = voice.lang; }
                        else { u.lang = 'zh-CN'; }
                        u.pitch = SAY_PITCH;
                        u.rate = SAY_RATE;
                        u.volume = SAY_VOLUME;
                        u.onend = function() { saying = false; };
                        u.onerror = function() { saying = false; };
                        speechSynthesis.speak(u);
                    }, 80);
                } catch (e) { saying = false; }
            }
            requestAnimationFrame(say);
        }
        requestAnimationFrame(say);

        document.addEventListener('visibilitychange', function() {
            if (!ttsOK) return;
            if (document.hidden) speechSynthesis.cancel();
        });

        /* ================ 点击添加新文字 ================ */
        stage.addEventListener('click', function(e) {
            var rect = stage.getBoundingClientRect();
            var cx = e.clientX - rect.left;
            var cy = e.clientY - rect.top;
            var fresh = new Glyph(cx, cy);
            items.push(fresh);
        });
        stage.addEventListener('touchstart', function(e) {
            var touch = e.changedTouches[0];
            var rect = stage.getBoundingClientRect();
            var cx = touch.clientX - rect.left;
            var cy = touch.clientY - rect.top;
            var fresh = new Glyph(cx, cy);
            items.push(fresh);
        }, { passive: true });

        /* ================ 解除遮罩 ================ */
        function dismissVeil() {
            if (veil.style.display === 'none') return;
            veil.style.opacity = '0';
            veil.style.pointerEvents = 'none';
            setTimeout(function() {
                veil.style.display = 'none';
            }, 400);
        }
        document.addEventListener('keydown', dismissVeil);
        veil.addEventListener('click', dismissVeil);
        veil.addEventListener('touchstart', dismissVeil, { passive: true });
    </script>
</body>
</html>
